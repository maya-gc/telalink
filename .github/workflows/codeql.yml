# Analise estatica de seguranca (CodeQL, do proprio GitHub): procura
# vulnerabilidades conhecidas no codigo (injecao, XSS, path traversal...).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analise:
    # Em repositorio privado o CodeQL exige o plano pago GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
