# Analise estatica de seguranca (CodeQL, do proprio GitHub): procura
# vulnerabilidades conhecidas no codigo (injecao, XSS, path traversal...).
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 3"

permissions:
  contents: read
  security-events: write

jobs:
  analise:
    # Em repositorio privado o CodeQL exige o plano pago GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
